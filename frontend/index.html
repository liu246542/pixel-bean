<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Bean — Perler Bead Pattern Generator</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <!-- ── Header ──────────────────────────────────────────────────────── -->
    <header class="header">
      <h1 class="header__title">Pixel Bean</h1>
      <div class="header__ai">
        <input
          id="aiUrl"
          type="text"
          placeholder="AI 服务地址 (含 token)"
        />
        <button id="aiTest" class="btn btn--sm">测试连接</button>
        <span id="aiStatus" class="ai-status"></span>
      </div>
    </header>

    <!-- ── Main layout: top controls → full-width previews ─────────────── -->
    <main class="layout">

      <!-- Top bar: upload + settings + actions (single row on desktop) -->
      <section class="top-bar">
        <div class="top-bar__left">
          <div id="uploadArea" class="upload-area-compact">
            <input id="fileInput" type="file" accept="image/*" hidden />
            <span>上传图片</span>
          </div>

          <div id="imageActions" class="action-group hidden">
            <button id="cropBtn" class="btn btn--sm">裁剪</button>
          </div>
          <div id="aiActions" class="action-group hidden">
            <button id="aiOptimize" class="btn btn--sm btn--primary">AI 优化</button>
            <button id="aiGenerate" class="btn btn--sm">AI 生成</button>
          </div>
        </div>

        <div class="top-bar__controls">
          <label class="inline-control">
            <span>粒度</span>
            <input id="granularity" type="range" min="10" max="200" value="30" />
            <span id="granularityVal">30</span>
          </label>
          <label class="inline-control">
            <span>合并</span>
            <input id="mergeThreshold" type="range" min="0" max="100" value="40" />
            <span id="mergeVal">40</span>
          </label>
          <select id="pixelMode" class="compact-select">
            <option value="dominant">主色卡通</option>
            <option value="average">均色真实</option>
          </select>
          <select id="colorSystem" class="compact-select">
            <!-- Populated by JS -->
          </select>
        </div>
      </section>

      <!-- AI prompt bar -->
      <div id="aiPromptWrap" class="ai-prompt-wrap hidden">
        <textarea
          id="aiPrompt"
          class="ai-prompt"
          rows="2"
          placeholder="描述你想要的图案（如：一只可爱的猫咪）"
        ></textarea>
      </div>

      <!-- Hidden processing canvas (off-screen, not in layout flow) -->
      <canvas id="originalCanvas" style="display:none"></canvas>

      <!-- Dual preview: original + pixel pattern (full width) -->
      <section class="dual-preview">
        <div class="preview-pane">
          <h4>原图</h4>
          <img id="originalPreview" class="preview-img hidden" />
        </div>
        <div class="preview-pane">
          <h4>拼豆图案 <button id="editToggle" class="btn btn--sm hidden">编辑</button></h4>
          <div class="preview-wrap">
            <canvas id="previewCanvas"></canvas>
            <div id="tooltip" class="tooltip hidden"></div>
          </div>
        </div>
      </section>

      <!-- Edit toolbar -->
      <div id="editToolbar" class="edit-toolbar hidden">
        <span>选择颜色：</span>
        <div id="editPalette" class="edit-palette"></div>
        <button id="editUndo" class="btn btn--sm" disabled>撤销</button>
        <button id="editRedo" class="btn btn--sm" disabled>重做</button>
        <button id="editDone" class="btn btn--sm btn--primary">完成编辑</button>
      </div>

      <!-- Color stats + export (side by side below previews) -->
      <section class="bottom-bar">
        <div class="panel" id="statsPanel">
          <h3>颜色统计 <span id="totalCount" class="total-count"></span></h3>
          <div id="colorList" class="color-list"></div>
        </div>
        <div class="panel export-panel">
          <button id="saveBtn" class="btn btn--primary" disabled>保存</button>
          <button id="exportGrid" class="btn" disabled>导出图纸</button>
          <button id="exportStats" class="btn" disabled>导出统计</button>
          <button id="exportCsv" class="btn" disabled>导出 CSV</button>
          <label class="btn import-csv-label">
            导入 CSV
            <input id="importCsv" type="file" accept=".csv" hidden />
          </label>
          <button id="focusBtn" class="btn" disabled>专注拼豆</button>
        </div>
      </section>

    </main>

    <!-- ── Footer ──────────────────────────────────────────────────────── -->
    <footer class="footer">
      &copy; 2024-2026 Feng Liu &middot; <a href="https://github.com/liu246542/pixel-bean" target="_blank" rel="noopener">GitHub</a>
    </footer>

    <!-- ── Loading overlay ─────────────────────────────────────────────── -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="loading-spinner"></div>
      <p id="loadingText">处理中…</p>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
